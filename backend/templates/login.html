<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f7fb; margin: 0; }
    .card { max-width: 420px; margin: 64px auto; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
    h1 { margin-top: 0; font-size: 24px; }
    label { display: block; margin: 12px 0 6px; font-size: 14px; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #cdd5df; border-radius: 8px; }
    button { margin-top: 16px; width: 100%; padding: 10px 12px; border: 0; border-radius: 8px; background: #1f6feb; color: #fff; cursor: pointer; }
    .muted { color: #5f6c7b; font-size: 13px; margin-top: 12px; }
    .msg { margin-top: 10px; font-size: 14px; }
    textarea { margin-top: 12px; width: 100%; min-height: 100px; box-sizing: border-box; border: 1px solid #cdd5df; border-radius: 8px; padding: 10px 12px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>{{ title or "Log in" }}</h1>
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Your password" required />

      <button type="submit">Log in</button>
      <div class="msg" id="msg"></div>
      <textarea id="token" placeholder="JWT token appears here after successful login"></textarea>
    </form>
    <p class="muted">New user? <a href="{{ signup_url or '/signup' }}">Create account</a></p>
  </main>

  <script type="module">
    import { login } from "{{ api_client_src or '/frontend/assets/apiClient.js' }}";
    const form = document.getElementById("login-form");
    const msg = document.getElementById("msg");
    const tokenBox = document.getElementById("token");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "Logging in...";
      const payload = {
        email: form.email.value.trim(),
        password: form.password.value
      };
      const result = await login(payload);
      if (typeof result === "string") {
        msg.textContent = result;
        return;
      }
      tokenBox.value = result.access_token || "";
      msg.textContent = "Login successful.";
    });
  </script>
</body>
</html>
