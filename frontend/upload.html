<!DOCTYPE html>
<html>
<head>
    <title>Upload Resume</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" style="width: 450px;">
    <h2>Upload Resume</h2>

    <input type="file" id="file">

    <textarea id="jd" placeholder="Paste Job Description here..." rows="4"></textarea>

    <button onclick="uploadResume()">Upload</button>

    <pre id="result" style="text-align:left; margin-top:15px; white-space:pre-wrap;"></pre>
</div>

<script src="script.js"></script>
</body>
</html>
